<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <meta name="color-scheme" content="light dark">
        <link rel="stylesheet" href="css/index.css">
        <title>Word Press App with Firebase Auth</title>
    </head>
    <body>
         <main>
            <!-- Login Form -->
            <section id="login-form" class="form-container">
                 <form id="login" action="/login" method="POST">
                    <legend>Login</legend>
                    <input type="email" name="email" id="loginEmail" placeholder="Email" required size="20">
                    <input type="password" name="password" id="loginPassword" placeholder="Password" required size="9">
                    <button type="submit" id="login-button">Login</button>
                </form>
                <p class="login-message" id="login-message"></p>
                <p>Don't have an account? <a href="#" id="show-signup">Sign Up</a></p>
            </section>

            <!-- Sign Up Form -->
            <section id="signup-form" class="form-container hidden">
                <form id="signup" action="/signup" method="POST">
                    <legend>Sign up</legend>
                    <label for="username">Username (required): </label>
                    <input type="text" 
                            name="username" 
                            id="usernameInput" 
                            placeholder="Username" 
                            required>
                    <br>
                    <label for="Email">Email (required): </label>
                    <input type="email" 
                            name="email" 
                            id="emailInput" 
                            placeholder="Email" 
                            required 
                    >
                    <br>
                    <label for="phone-number">Phone-Number (required) </label>
                    <input type="tel" 
                            name="phone" 
                            id="phoneInput" 
                            placeholder="08165624896" 
                            required size="11"
                    >
                    <br>
                    <label for="password">Password (required):</label>
                    <input type="password" 
                            name="password"
                            id="passwordInput" 
                            minlength="8"
                            placeholder="Password" 
                            required
                    >
                            
                    <br>
                    <button type="submit" id="signup-button">Sign Up</button>
                </form>
                <p class="auth-message" id="auth-message"></p>
                <p>Already have an account? <a href="#" id="show-login">Login</a></p>
            </section>
  
            <section class="user-profile hidden" id="user-profile">
                <header class="app-header">
                    <div>
                        <h2>Welcome, <span id="profile-email"></span></h2>
                        <!-- <p>Email: <span id="profile-email"></span></p>
                        <p>Phone: <span id="profile-phone"></span></p> -->
                    </div>
                    <button type="button" id="log-out">Log out</button>
                </header>
                <div id="posts">Loading Posts...</div>
            </section>
    </main>
        <script type= "module" src="js/app.js"></script>
    </body>
</html>
