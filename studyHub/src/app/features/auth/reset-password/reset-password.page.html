<ion-content>
  <main class="auth-page">
    <!-- Brand -->
    <div class="auth-brand">
      <img src="assets/images/mastericon.png" alt="Study Hub" />

      <p>Study Hub</p>
    </div>

    <section class="auth-container" aria-labelledby="reset-password-heading">
      <!-- Heading -->
      <div class="auth-header">
        <div class="auth-icon">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>

        <h1 id="reset-password-heading">Reset Password</h1>

        <p>
          Create a new password for your Study Hub account.
        </p>
      </div>

      <!-- Password -->
      <div class="form-field">
        <ion-label position="stacked">New Password</ion-label>

        <ion-item lines="none">
          <ion-icon
            slot="start"
            name="lock-closed-outline"
          ></ion-icon>

          <ion-input
            [type]="showPassword ? 'text' : 'password'"
            [(ngModel)]="password"
            placeholder="Enter your new password"
            autocomplete="new-password"
          ></ion-input>

          <ion-button
            slot="end"
            fill="clear"
            type="button"
            aria-label="Toggle password visibility"
            (click)="togglePasswordVisibility()"
          >
            <ion-icon
              [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
            ></ion-icon>
          </ion-button>
        </ion-item>
      </div>

      <!-- Confirm Password -->
      <div class="form-field">
        <ion-label position="stacked">Confirm Password</ion-label>

        <ion-item lines="none">
          <ion-icon
            slot="start"
            name="lock-closed-outline"
          ></ion-icon>

          <ion-input
            [type]="showConfirmPassword ? 'text' : 'password'"
            [(ngModel)]="confirmPassword"
            placeholder="Confirm your new password"
            autocomplete="new-password"
          ></ion-input>

          <ion-button
            slot="end"
            fill="clear"
            type="button"
            aria-label="Toggle confirm password visibility"
            (click)="toggleConfirmPasswordVisibility()"
          >
            <ion-icon
              [name]="
                showConfirmPassword
                  ? 'eye-off-outline'
                  : 'eye-outline'
              "
            ></ion-icon>
          </ion-button>
        </ion-item>
      </div>

      <!-- Password requirements -->
      <div class="password-hint">
        Password must be at least 6 characters.
      </div>

      <!-- Submit -->
      <ion-button
        expand="block"
        class="auth-submit"
        type="button"
        [disabled]="isLoading"
        (click)="resetPassword()"
      >
        {{ isLoading ? "Updating..." : "Update Password" }}
      </ion-button>

      <!-- Back to login -->
      <div class="auth-footer">
        <span>Remember your password?</span>

        <a routerLink="/login">Back to Login</a>
      </div>
    </section>
  </main>
</ion-content>
