<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="initial-scale=1, width=device-width, viewport-fit=cover">
        <link rel="stylesheet" href="css/index.css">
        <title>BINCOM Student Task App</title>
    </head>
    <body>
        <header class="app-header">
            <h1>BINCOM Student app</h1>
            <p>Learning Cordova + app.js</p>
        </header>

        <main class="container">
            <section class="card">
                <h2>App Status</h2>
                <p id="cordovaStatus" class="status">Waiting for Cordova...</p>
            </section>
            <section class="card">
                <h2>1. Student Greeting</h2>
                <input type="text" id="nameInput" placeholder="Enter your name">
                <button onclick="greetStudent()">Say Hello</button>
                <p id="greetingOutput"></p>
            </section>
            <section class="card">
                <h2>2. Simple Counter</h2>
                <p class="counter" id="countOutput">0</p>
                <div class="button-row">
                    <button onclick="changeCount(-1)">-1</button>
                    <button onclick="resetCounter()">Reset</button>
                    <button onclick="changeCount(+1)">+1</button>
                    <button onclick="changeCount(+5)">+5</button>
                </div>
            </section>
            <section class="card">
                <h2>3. Task List</h2>
                <input type="text" id="taskInput" placeholder="Enter a task">
                <button onclick="addTask()">Add Task</button>
                <ul id="taskList"></ul>
            </section>
             <section class="card">
                <h2>4. Small UI Feature</h2>
                <button onclick="toggleTheme()">Toggle Theme</button>
            </section>
        </main>
        <script src="js/app.js"></script>
    </body>
</html>
